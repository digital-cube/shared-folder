# The whole vhost when shfd-gui is the root of the host (SHFD_GUI_BASE=
# empty in shfd-gui.service), docs/gui.md. shfd keeps its own paths
# (/v1/ with the WebSocket of a share, /healthz, /downloads/); everything
# else is shfd-gui. shfd's `GET /` (the JSON of /healthz) is no longer
# reachable from outside: use /healthz.
#
# The other option, the GUI under /gui inside an existing shfd vhost, is
# nginx-gui.conf.
#
# Plain HTTP here: on the test server TLS ends on the nginx in front of the
# VM. With TLS on this nginx, add `listen 443 ssl` and the certificates.

# Upgrade only when the client asks for it (the share WebSocket).
map $http_upgrade $shfd_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name shared-storage.example.org;

    client_max_body_size 0;
    # Redirects as "Location: /…", so that behind a TLS edge they stay https.
    absolute_redirect off;

    # ---- shfd (127.0.0.1:8443) --------------------------------------------

    location /v1/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /v1/shares/{id}/ws: WebSocket, open for as long as the client runs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shfd_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_request_buffering off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /downloads/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- shfd-gui (127.0.0.1:8444) ----------------------------------------

    location / {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The change stream (Server-Sent Events) must not be buffered and stays
    # open for long.
    location /udc/changes {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # nginx consumes the X-Accel-Buffering of shfd-gui; send it on, so that
        # a proxy in front of this one (TLS at the edge) does not buffer either.
        add_header X-Accel-Buffering no always;
    }

    # Old bookmarks of the GUI under /gui: /gui/ → /, /gui/<x> → /<x>
    # (the fragment, #files and the like, stays with the browser).
    location = /gui {
        return 301 /;
    }
    location /gui/ {
        rewrite ^/gui/(.*)$ /$1 permanent;
    }
}

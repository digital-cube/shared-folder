# shfd-gui under /gui (SHFD_GUI_BASE=/gui), inside the server { } of the
# vhost that already proxies to shfd on 127.0.0.1:8443 (docs/gui.md). For
# the GUI at the root of the host see nginx-gui-root.conf. The change stream
# (Server-Sent Events) must not be buffered and stays open for long.
location /gui/ {
    proxy_pass http://127.0.0.1:8444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /gui {
    return 301 /gui/;
}
location /gui/udc/changes {
    proxy_pass http://127.0.0.1:8444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # nginx consumes the X-Accel-Buffering of shfd-gui; send it on, so that
    # a proxy in front of this one (TLS at the edge) does not buffer either.
    add_header X-Accel-Buffering no always;
}
